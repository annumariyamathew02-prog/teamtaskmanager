<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Task Manager</title>
  <link href="https://fonts.googleapis.com/css?family=Inter:400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <section id="auth-section" class="auth-card">
      <h1>🗂 Team Task Manager</h1>
      <p class="auth-subtitle">Sign in to manage your team's tasks</p>
      <form id="auth-form" autocomplete="off">
        <div class="form-group">
          <input type="email" id="auth-email" placeholder="Email" required>
          <i class="fas fa-envelope input-icon"></i>
        </div>
        <div class="form-group">
          <input type="password" id="auth-password" placeholder="Password" required>
          <i class="fas fa-lock input-icon"></i>
        </div>
        <button type="submit" id="login-btn" class="primary-btn">
          <i class="fas fa-sign-in-alt"></i> Log In
        </button>
        <button type="button" id="signup-btn" class="secondary-btn">
          <i class="fas fa-user-plus"></i> Create Account
        </button>
        <p id="auth-error" class="auth-error" style="display: none;"></p>
      </form>
    </section>

    <section id="main-app" class="container" style="display: none;">
      <div class="app-header">
        <h1>Team Task Manager <span id="welcome-msg"></span></h1>
        <button id="logout-btn" class="ghost-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="all">All Tasks</button>
        <button class="filter-btn" data-filter="pending">Pending</button>
        <button class="filter-btn" data-filter="in-progress">In Progress</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>

      <form id="task-form" class="task-form" autocomplete="off">
        <div class="form-row">
          <div class="form-group">
            <input type="text" id="task-title" placeholder="Task Title" required>
            <i class="fas fa-heading input-icon"></i>
          </div>
          <div class="form-group">
            <input type="date" id="task-date" required>
            <i class="far fa-calendar-alt input-icon"></i>
          </div>
        </div>
        <div class="form-group">
          <textarea id="task-desc" placeholder="Task Description"></textarea>
          <i class="fas fa-align-left input-icon"></i>
        </div>
        <div class="form-group">
          <input type="text" id="task-assignee" placeholder="Assign to (name or email)" list="assignee-options" required>
          <i class="fas fa-user-tag input-icon"></i>
          <datalist id="assignee-options"></datalist>
        </div>
        <button type="submit" class="primary-btn">
          <i class="fas fa-plus-circle"></i> Add Task
        </button>
      </form>

      <div id="task-list" class="task-grid"></div>
    </section>

    <div id="reminder-popup" class="reminder-popup">
      <div class="reminder-content">
        <span class="close-popup" id="close-popup">&times;</span>
        <h3>⏰ Reminder</h3>
        <p id="reminder-text"></p>
      </div>
    </div>

    <button class="fab-add" id="add-task-fab" aria-label="Add task">
      <i class="fas fa-plus"></i>
    </button>
  </main>

  <!-- Firebase SDKs -->
  <script type="module" src="firebase-init.js"></script>

  <!-- Your app's JavaScript -->
  <script type="module" src="script.js"></script>
</body>
</html>
